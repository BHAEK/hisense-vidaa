name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    name: library (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mqtt]" pytest-cov
      - run: python tools/check_versions.py
      - run: python tools/sync_vendor.py --check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=vidaa_tv --cov-fail-under=85

  integration:
    name: Home Assistant integration (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component aiomqtt==2.5.1
      - run: pytest tests/ha -q
