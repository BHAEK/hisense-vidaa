[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidaa-tv"
version = "0.1.0.dev0"
description = "Async client library for Hisense TVs running VIDAA OS, with a Home Assistant integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mqtt = ["aiomqtt>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/vidaa_tv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
