[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidaa-tv"
description = "Async client library for Hisense TVs running VIDAA OS, with a Home Assistant integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
mqtt = ["aiomqtt>=2.5.0,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.version]
path = "src/vidaa_tv/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vidaa_tv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["custom_components/hisense_vidaa/vidaa_tv"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
